<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-sky-100 flex items-center justify-center min-h-screen">

  <div class="bg-white w-90 rounded-2xl shadow-lg overflow-hidden">

    <!-- Top Cover -->
    <div class="h-32 bg-blue-500"></div>

    <!-- Profile Image -->
    <div class="flex justify-center -mt-12">
      <img src="Naveed.img.jpeg"
           class="w-28 h-28 rounded-full border-4 border-white object-fill">
    </div>

    <!-- Content -->
    <div class="text-center p-5">

      <h2 class="text-xl font-bold text-gray-800">Naveed Khan</h2>
      <p class="text-gray-500 text-sm">Software Engineering Student</p>

      <p class="text-gray-600 text-sm mt-3">
        Passionate about Web Development and Tailwind CSS.
      </p>

      <!-- Stats -->
      <div class="flex justify-between mt-5 text-center">
        <div>
          <h3 class="font-bold text-gray-800">120</h3>
          <p class="text-xs text-gray-500">Posts</p>
        </div>

        <div>
          <h3 class="font-bold text-gray-800">15K</h3>
          <p class="text-xs text-gray-500">Followers</p>
        </div>

        <div>
          <h3 class="font-bold text-gray-800">500</h3>
          <p class="text-xs text-gray-500">Following</p>
        </div>
      </div>

      <!-- Buttons -->
      <div class="mt-5 flex gap-3">
        <button class="w-1/2 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 active:scale-95">
          Follow
        </button>

        <button class="w-1/2 border border-blue-600 text-blue-600 py-2 rounded-lg hover:bg-blue-50 active:scale-95">
          Message
        </button>
      </div>

    </div>

  </div>

</body>
</html>
