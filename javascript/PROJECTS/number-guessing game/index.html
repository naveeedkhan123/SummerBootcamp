<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="preconnect" href="https://fonts.gstastic.com" <link
        href="https://fonts.googleapis.com/css?family=Poppins:100,100italic,200,200italic,300,300italic,regular,italic,500,500italic,600,600italic,700,700italic,800,800italic,900,900italic"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h3>I am Thinking Of a Number between 1 - 100</h3>

        <h3>Can you Guess it ?</h3>

        <input type="text" id="guess" placeholder="Number">
        </br>

        <button onclick="play()" id="my_btn">Guess</button>

        <p id="message1">No. of Guessess : 0</p>

        <p id="message2">Guessed Numbers are : None</p>

        <p id="message3"></p>
    </div>


    <script src="script.js"></script>
</body>

</html>
