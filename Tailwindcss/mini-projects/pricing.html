<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Card</title>

  <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-sky-200 min-h-screen flex items-center justify-center">

  <div class="grid md:grid-cols-3 gap-12">

    <!-- Basic -->
    <div class="bg-white p-6 rounded-2xl shadow-md text-center hover:scale-105 transition duration-300">

      <h1 class="text-2xl font-bold text-gray-800">Basic</h1>
      <p class="text-gray-500 mt-2">For beginners</p>

      <h1 class="text-4xl font-bold mt-5">$9</h1>
      <p class="text-gray-400 text-sm">/month</p>

      <ul class="mt-5 space-y-2 text-gray-600 text-sm">
        <li> 10 Projects</li>
        <li> Basic Support</li>
        <li> 1 Team Member</li>
      </ul>

      <button class="mt-6 w-full bg-gray-200 py-2 border-2 rounded-lg hover:bg-gray-300">
        Choose Plan
      </button>

    </div>

    <!-- Pro (Highlighted) -->
    <div class="bg-blue-600 text-white p-6 rounded-2xl shadow-xl scale-105">

      <h2 class="text-2xl font-bold">Pro</h2>
      <p class="text-blue-100 mt-2">Most popular</p>

      <h1 class="text-4xl font-bold mt-5">$29</h1>
      <p class="text-blue-100 text-sm">/month</p>

      <ul class="mt-5 space-y-2 text-sm">
        <li> Unlimited Projects</li>
        <li> Priority Support</li>
        <li> 5 Team Members</li>
      </ul>

      <button class="mt-6 w-full bg-white text-blue-600 border-2 border-black py-2 rounded-lg font-semibold hover:bg-gray-100">
        Choose Plan
      </button>

    </div>

    <!-- Premium -->
    <div class="bg-white p-6 rounded-2xl shadow-md text-center hover:scale-105 transition duration-300">

      <h2 class="text-2xl font-bold text-gray-800">Premium</h2>
      <p class="text-gray-500 mt-2">For businesses</p>

      <h1 class="text-4xl font-bold mt-5">$49</h1>
      <p class="text-gray-400 text-sm">/month</p>

      <ul class="mt-5 space-y-2 text-gray-600 text-sm">
        <li> Everything in Pro</li>
        <li> 24/7 Support</li>
        <li> Unlimited Team</li>
      </ul>

      <button class="mt-6 w-full bg-gray-200 border-2 py-2 rounded-lg hover:bg-gray-300">
        Choose Plan
      </button>

    </div>

  </div>

</body>
</html>
