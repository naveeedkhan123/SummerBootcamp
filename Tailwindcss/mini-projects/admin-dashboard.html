<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard UI</title>
<link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

  <!-- Sidebar -->
  <div class="w-60 bg-blue-600 text-white p-5 hidden md:block">
    <h1 class="text-2xl font-bold mb-8">Admin Panel</h1>

    <ul class="space-y-4">
      <li class="hover:bg-blue-700 p-2 rounded cursor-pointer">Dashboard</li>
      <li class="hover:bg-blue-700 p-2 rounded cursor-pointer">Users</li>
      <li class="hover:bg-blue-700 p-2 rounded cursor-pointer">Products</li>
      <li class="hover:bg-blue-700 p-2 rounded cursor-pointer">Orders</li>
      <li class="hover:bg-blue-700 p-2 rounded cursor-pointer">Settings</li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="flex-1 p-6">

    <!-- Top Bar -->
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Dashboard</h2>

      <div class="flex items-center gap-3">
        <input class="px-3 py-2 border rounded-lg" placeholder="Search...">
        <img class="w-12 h-12 rounded-full"
             src="Naveed.img.jpeg">
      </div>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-gray-500">Users</h3>
        <p class="text-2xl font-bold">1,240</p>
      </div>

      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-gray-500">Sales</h3>
        <p class="text-2xl font-bold">$8,540</p>
      </div>

      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-gray-500">Orders</h3>
        <p class="text-2xl font-bold">320</p>
      </div>

      <div class="bg-white p-5 rounded-xl shadow">
        <h3 class="text-gray-500">Revenue</h3>
        <p class="text-2xl font-bold">$12,300</p>
      </div>

    </div>

    <!-- Table Section -->
    <div class="mt-8 bg-white p-5 rounded-xl shadow">
      <h3 class="text-lg font-bold mb-4">Recent Orders</h3>

      <div class="space-y-4 space-x-3 p-4">

        <div class="flex justify-between border-b pb-2">
          <span>Order #1021</span>
          <span class="text-green-600">Completed</span>
        </div>

        <div class="flex justify-between border-b pb-2">
          <span>Order #1022</span>
          <span class="text-yellow-500">Pending</span>
        </div>

        <div class="flex justify-between">
          <span>Order #1023</span>
          <span class="text-red-500">Cancelled</span>
        </div>

      </div>
    </div>

  </div>

</div>

</body>
</html>
