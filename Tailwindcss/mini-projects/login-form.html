<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body  class="bg-sky-200 min-h-screen flex items-center justify-center">
    
     <div class="bg-white w-96 p-8 rounded-2xl shadow-lg">

         <!-- Title -->
    <h2 class="text-2xl font-bold text-center text-gray-800">Login</h2>
    <p class="text-center text-gray-500 text-1xl mt-1 font-medium">Welcome back </p>

     <!-- Form -->
    <form class="mt-6 space-y-4">

      <!-- Email -->
      <div>
        <label class="text-1xl text-gray-600 font-medium">Email</label>
        <input 
          type="email"
          placeholder="Enter your email"
          class="w-full mt-1 px-4 py-2  border-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

       <!-- Password -->
      <div>
        <label class="text-sm text-gray-600 font-medium">Password</label>
        <input 
          type="password"
          placeholder="Enter your password"
          class="w-full mt-1 px-4 py-2 border-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
      </div>

      <!-- Remember + Forgot -->
      <div class="flex justify-between items-center text-sm">
        <label class="flex items-center gap-2 text-gray-600 font-medium">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#" class="text-blue-600 hover:underline">Forgot password?</a>
      </div>

     <!-- Button -->
      <button 
        type="submit"
        class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
      >
        Login
      </button>

    </form>
</div>
</body>
</html>
