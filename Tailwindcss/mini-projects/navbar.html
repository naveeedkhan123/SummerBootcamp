<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar</title>
<link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-gray-100">

  <!-- Navbar -->
  <nav class="bg-white shadow-md">

    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">

      <!-- Logo -->
      <h1 class="text-2xl font-bold text-blue-600">Naveed Khan</h1>

      <!-- Menu -->
      <ul class="hidden md:flex space-x-6 text-gray-700 font-medium">
        <li class="hover:text-blue-600 cursor-pointer">Home</li>
        <li class="hover:text-blue-600 cursor-pointer">About</li>
        <li class="hover:text-blue-600 cursor-pointer">Services</li>
        <li class="hover:text-blue-600 cursor-pointer">Contact</li>
      </ul>

      <!-- Button -->
      <button class="hidden md:block bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
        Login
      </button>

      <!-- Mobile Menu Icon -->
      <div class="md:hidden text-3xl cursor-pointer">
        ☰
      </div>

    </div>

  </nav>

  <!-- Content -->
  <div class="p-10 text-center text-gray-600 text-2xl font-bold">
    Responsive Navbar Practice
  </div>

</body>
</html>
